<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Español">
  <meta name="theme-color" content="#0b1724" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f6f7" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/onest-normal-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <title>Español Benidorm</title>
</head>
<body>
  <main id="screen"></main>
  <nav id="nav"></nav>
  <script type="module">
    import { startApp } from './js/app.js';
    import { autoSync } from './js/sync.js';
    import { initVoice } from './js/tts.js';
    import { refreshBadge } from './js/reminders.js';
    import { initCapture, processQueue } from './js/capture.js';
    import { ensureWordUids } from './js/db.js';
    import './js/today.js';
    import './js/session.js';
    import './js/practice.js';
    import './js/drills.js';
    import './js/teacher.js';
    import './js/chat.js';
    import './js/study.js';
    import './js/daily.js';
    import './js/roleplay.js';
    import './js/reader.js';
    import './js/dictionary.js';
    import './js/listening.js';
    import './js/speech.js';
    import './js/grammar.js';
    import './js/assignments.js';
    import './js/progress.js';
    import './js/settings.js';
    // Просим браузер не стирать данные при нехватке места (Safari иначе может очистить их через 7 дней без визитов).
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    ensureWordUids().catch(() => {});
    startApp();
    initCapture();
    await initVoice();
    // После синхронизации разбираем слова, которые пришли с других устройств (например, из команды iPhone).
    autoSync().then(processQueue);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') autoSync().then(processQueue).then(() => refreshBadge());
    });
    refreshBadge();
    if ('serviceWorker' in navigator) {
      // Когда установилась новая версия — один раз перезагружаемся на неё.
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloading) return;
        reloading = true;
        location.reload();
      });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
        // Проверяем обновления и при возвращении в приложение (iPhone держит его открытым днями).
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      }).catch(() => {});
    }
  </script>
</body>
</html>
